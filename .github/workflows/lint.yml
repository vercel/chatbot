name: Lint
on:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm and Node.js ${{ matrix.node-version }}
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          require-lockfile: true
      - name: Run check
        run: pnpm check
